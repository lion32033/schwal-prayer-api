- name: Änderungen committen und pushen
           run: |
             git config --global user.name "GitHub Action Bot"
             git config --global user.email "action@github.com"
             git add prayer-schwal.json mawaqit_page.html
             git diff --quiet && git diff --staged --quiet || (git commit -m "Update prayer times and HTML [skip ci]" && git push)
