name: Daily Prayer Times Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Läuft jeden Tag um 00:00 Uhr
  workflow_dispatch:      # Erlaubt jederzeit den manuellen Start über GitHub

jobs:
  update-prayer-times:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Skript ausführen
        run: python prayer.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add prayer-schwal.json mawaqit_page.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily update: prayer times & text [skip ci]" && git push)
